<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio & Service Inquiry</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --border: #334155;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: clamp(1rem, 4vw, 2.5rem);
    }

    .container {
      width: 100%;
      max-width: min(100%, 640px);
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: clamp(1.25rem, 5vw, 2.5rem);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    h1 { font-size: clamp(1.5rem, 4vw, 2rem); margin-bottom: 0.5rem; }
    p.subtitle { color: var(--text-muted); font-size: clamp(0.875rem, 2.5vw, 1rem); margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1.25rem; }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.375rem;
    }

    input[type="text"], input[type="email"], select, textarea {
      width: 100%;
      padding: 0.75rem;
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 120px; }
    .hidden { display: none !important; }

    button[type="submit"] {
      width: 100%;
      padding: 0.875rem;
      background-color: var(--accent);
      color: #000;
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button[type="submit"]:hover { background-color: var(--accent-hover); color: #fff; }
    button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>

  <main class="container">
    <h1>Portfolio Inquiry</h1>
    <p class="subtitle">Looking for a custom project, graphic asset, or design style from one of my repositories? Get in touch below.</p>

    <form id="form">
      <input type="checkbox" name="botcheck" class="hidden" style="display:none">

      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" placeholder="Jane Doe" required>
      </div>

      <div class="form-group">
        <label for="email">Your Email</label>
        <input type="email" id="email" name="email" placeholder="jane@example.com" required>
      </div>

      <div class="form-group">
        <label for="inquiry-type">Inquiry Type</label>
        <select id="inquiry-type" name="inquiry_type">
          <option value="">-- Select Inquiry Type --</option>
          <option value="custom-project">New Build / Graphic Design</option>
          <option value="style-request">Request Style/Asset From Repository</option>
          <option value="general">General Question</option>
        </select>
      </div>

      <div class="form-group hidden" id="build-type-group">
        <label for="build-type">How would you like to start?</label>
        <select id="build-type" name="build_approach">
          <option value="">-- Select Approach --</option>
          <option value="from-scratch">Completely From Scratch</option>
          <option value="from-asset">Based on an Existing Repository Asset</option>
        </select>
      </div>

      <!-- Clean Title Dropdown Selector -->
      <div class="form-group hidden" id="repo-group">
        <label for="repo-select">Select Reference Graphic Asset</label>
        <select id="repo-select" name="reference_graphic_url">
          <option value="">Loading repository assets...</option>
        </select>
      </div>

      <div class="form-group">
        <label for="message">Project & Style Details</label>
        <textarea id="message" name="message" placeholder="Describe the style, layout, or graphic requirements you're looking for..." required></textarea>
      </div>

      <button type="submit">Send Inquiry</button>
    </form>
  </main>

  <script>
    const form = document.getElementById('form');
    const submitBtn = form.querySelector('button[type="submit"]');
    const inquiryType = document.getElementById('inquiry-type');
    const buildTypeGroup = document.getElementById('build-type-group');
    const buildType = document.getElementById('build-type');
    const repoGroup = document.getElementById('repo-group');
    const repoSelect = document.getElementById('repo-select');

    function resetProgressiveFields() {
      buildTypeGroup.classList.add('hidden');
      repoGroup.classList.add('hidden');
      buildType.value = "";
      repoSelect.value = "";
    }

    inquiryType.addEventListener('change', (e) => {
      const val = e.target.value;
      resetProgressiveFields();

      if (val === 'custom-project') {
        buildTypeGroup.classList.remove('hidden');
      } else if (val === 'style-request') {
        repoGroup.classList.remove('hidden');
      }
    });

    buildType.addEventListener('change', (e) => {
      const val = e.target.value;
      if (val === 'from-asset') {
        repoGroup.classList.remove('hidden');
      } else {
        repoGroup.classList.add('hidden');
        repoSelect.value = "";
      }
    });

    // Helper function to format filenames/repo names into clean readable titles
    function formatTitle(filename) {
      return filename
        .replace(/\.[^/.]+$/, "") // Remove file extension
        .replace(/[-_]/g, " ")     // Replace dashes and underscores with spaces
        .replace(/\s+/g, " ")      // Collapse double spaces
        .trim();
    }

    async function fetchAllRepos() {
      const allowedExtensions = ['.png', '.jpg', '.jpeg', '.webp', '.svg', '.gif'];

      try {
        const res = await fetch('https://api.github.com/users/john-ogletree/repos?per_page=100&sort=updated');
        if (!res.ok) throw new Error('API Rate Limit');

        const repos = await res.json();
        const validRepos = repos.filter(r => !r.fork);

        repoSelect.innerHTML = '<option value="">-- Select a Graphic Asset --</option>';

        for (const repo of validRepos) {
          try {
            const treeRes = await fetch(`https://api.github.com/repos/john-ogletree/${repo.name}/git/trees/${repo.default_branch}?recursive=1`);
            if (!treeRes.ok) continue;

            const treeData = await treeRes.json();
            if (!treeData.tree) continue;

            treeData.tree.forEach(file => {
              if (file.type === 'blob' && allowedExtensions.some(ext => file.path.toLowerCase().endsWith(ext))) {
                const rawFileName = file.path.split('/').pop();
                const cleanTitle = formatTitle(rawFileName);

                const option = document.createElement('option');
                option.value = `https://raw.githubusercontent.com/john-ogletree/${repo.name}/${repo.default_branch}/${file.path}`;
                option.textContent = cleanTitle;
                repoSelect.appendChild(option);
              }
            });
          } catch (err) {
            console.warn(`Skipped ${repo.name}`);
          }
        }

      } catch (error) {
        console.warn('API Error:', error);
        repoSelect.innerHTML = '<option value="">-- Unable to load assets --</option>';
      }
    }

    fetchAllRepos();

    // Form submission handler
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData(form);
      if (formData.get("botcheck")) return;

      formData.append("access_key", "f2086e5a-00f9-43fd-8413-8ff17ef3da9f");

      const originalText = submitBtn.textContent;
      submitBtn.textContent = "Sending...";
      submitBtn.disabled = true;

      try {
        const response = await fetch("https://api.web3forms.com/submit", {
          method: "POST",
          body: formData
        });

        if (response.ok) {
          alert("Success! Your inquiry has been sent.");
          form.reset();
          resetProgressiveFields();
        } else {
          alert("Error sending inquiry.");
        }
      } catch (error) {
        alert("Something went wrong. Please try again.");
      } finally {
        submitBtn.textContent = originalText;
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
