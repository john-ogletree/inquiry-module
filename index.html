<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio & Service Inquiry</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --border: #334155;
      --radius: 8px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: clamp(1rem, 4vw, 2.5rem);
    }

    .container {
      width: 100%;
      max-width: min(100%, 640px);
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: clamp(1.25rem, 5vw, 2.5rem);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    h1 { font-size: clamp(1.5rem, 4vw, 2rem); margin-bottom: 0.5rem; }
    p.subtitle { color: var(--text-muted); font-size: clamp(0.875rem, 2.5vw, 1rem); margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1.25rem; }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.375rem;
    }

    input[type="text"], input[type="email"], textarea {
      width: 100%;
      padding: 0.75rem;
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 130px; }
    .hidden { display: none !important; }

    button[type="submit"] {
      width: 100%;
      padding: 0.875rem;
      background-color: var(--accent);
      color: #000;
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button[type="submit"]:hover { background-color: var(--accent-hover); color: #fff; }
    button[type="submit"]:disabled { opacity: 0.6; cursor: not-allowed; }
  </style>
</head>
<body>

  <main class="container">
    <h1>Portfolio Inquiry</h1>
    <p class="subtitle">Looking for a custom project, graphic design, or component build? Send details below.</p>

    <form id="form">
      <input type="checkbox" name="botcheck" class="hidden" style="display:none">

      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" placeholder="Jane Doe" required>
      </div>

      <div class="form-group">
        <label for="email">Your Email</label>
        <input type="email" id="email" name="email" placeholder="jane@example.com" required>
      </div>

      <div class="form-group">
        <label for="message">Project Details</label>
        <textarea id="message" name="message" placeholder="Describe what you're looking to build or design..." required></textarea>
      </div>

      <button type="submit">Send Inquiry</button>
    </form>
  </main>

  <script>
    const form = document.getElementById('form');
    const submitBtn = form.querySelector('button[type="submit"]');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData(form);
      if (formData.get("botcheck")) return;

      formData.append("access_key", "f2086e5a-00f9-43fd-8413-8ff17ef3da9f");

      const originalText = submitBtn.textContent;
      submitBtn.textContent = "Sending...";
      submitBtn.disabled = true;

      try {
        const response = await fetch("https://api.web3forms.com/submit", {
          method: "POST",
          body: formData
        });

        if (response.ok) {
          alert("Success! Your inquiry has been sent.");
          form.reset();
        } else {
          alert("Error sending inquiry.");
        }
      } catch (error) {
        alert("Something went wrong. Please try again.");
      } finally {
        submitBtn.textContent = originalText;
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
